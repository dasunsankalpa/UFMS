<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFMS - Add/Edit Facility</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background:#8B7355;font-size:17px;line-height:1.6}
        .container{max-width:1200px;margin:0 auto;padding:20px}
        .header{background:#3b444b;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .header h1{font-size:24px;color:#fff;font-weight:900;mix-blend-mode:difference}
        .header p{font-size:14px;margin-top:5px;color:#fff;font-weight:700;mix-blend-mode:difference}

        .section{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
        .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid #ddd}
        .section-title{font-size:18px;font-weight:bold;color:#333}
        .btn{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;transition:all 0.3s}
        .btn-primary{background:#3C1A47;color:#fff}
        .btn-primary:hover{background:#2a1233}
        .btn-success{background:#3C1A47;color:#fff;font-weight:bold}
        .btn-success:hover{background:#2a1233;color:#fff}
        .btn-secondary{background:#CBB9A3;color:#3C1A47;font-weight:bold}
        .btn-secondary:hover{background:#b8a68f;color:#3C1A47}
        .btn-danger{background:#e74c3c;color:#fff}
        .btn-danger:hover{background:#c0392b}
        .form-group{margin-bottom:10px}
        .form-row{display:flex;gap:12px;margin-bottom:10px}
        .form-col{flex:1}
        label{display:block;margin-bottom:5px;font-weight:600;color:#333;font-size:15px}
        input[type="text"],input[type="number"],input[type="file"],select,textarea{width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:15px;transition:border-color 0.3s}
        input[type="text"]:focus,input[type="number"]:focus,input[type="file"]:focus,select:focus,textarea:focus{border-color:#3C1A47;outline:none;box-shadow:0 0 0 3px rgba(60,26,71,0.1)}
        textarea{min-height:50px;resize:vertical}
        .checkbox-group{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 15px}
        .checkbox-item{display:flex;align-items:center;margin-bottom:0}
        .checkbox-item input{margin-right:10px;cursor:pointer}
        .checkbox-item label{margin-bottom:0;cursor:pointer}
        .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
        .image-upload-area{border:2px dashed #e5e7eb;border-radius:8px;padding:15px;text-align:center;background-color:#fafafa;transition:all 0.3s;margin-top:8px;cursor:pointer}
        .image-upload-area:hover{border-color:#3C1A47;background-color:#f8f5ff}
        .image-upload-area.dragover{border-color:#3C1A47;background-color:#f0ebf5}
        .upload-icon{font-size:36px;color:#bdc3c7;margin-bottom:8px}
        .upload-text{color:#7f8c8d;margin-bottom:8px;font-size:14px}
        .file-info{display:none;background-color:#e8f8f0;border:1px solid #2ecc71;border-radius:4px;padding:8px;margin-top:8px}
        .file-info.show{display:block}
        .file-name{font-weight:600;color:#2ecc71}
        .file-size{font-size:12px;color:#7f8c8d}
        .image-preview{max-width:150px;max-height:100px;border-radius:4px;margin-top:8px;display:none}
        .image-preview.show{display:block}
        #deleteBtn{display:none}
        @media (max-width:768px){.form-row{flex-direction:column}.header{flex-direction:column;text-align:center;gap:10px}}
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Manage Facility Profile</h1>
            <p>Add/Edit Facility</p>
        </div>
    </div>
    <div class="container">
        <div class="section">
            <div class="section-header">
                <h2 class="section-title" id="formTitle">Add New Facility</h2>
                <button class="btn btn-secondary" onclick="window.location.href='adminMAIN.html'">← Back to Dashboard</button>
            </div>
            <form id="addFacilityForm" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="facilityType">Facility Type</label>
                            <select id="facilityType" name="facilityType" required>
                                <option value="">Select Facility Type</option>
                                <option value="lecture_hall">Lecture Hall</option>
                                <option value="computer_lab">Computer Lab</option>
                                <option value="seminar_room">Seminar Room</option>
                                <option value="auditorium">Auditorium</option>
                                <option value="meeting_room">Meeting Room</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="facilityName">Facility Name</label>
                            <input type="text" id="facilityName" name="facilityName" placeholder="e.g., Main Lecture Hall" required>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="facilityCode">Facility Code</label>
                            <input type="text" id="facilityCode" name="facilityCode" placeholder="e.g., LH-001" required>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="capacity">Capacity</label>
                            <input type="number" id="capacity" name="capacity" min="1" placeholder="e.g., 200" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Building A, Floor 3" required>
                </div>
                <div class="form-group">
                    <label for="facilityImage">Facility Image</label>
                    <div class="image-upload-area" id="imageUploadArea">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">
                            <strong>Click to upload</strong> or drag and drop<br>
                            Supported formats: JPG, PNG, GIF (Max 5MB)
                        </div>
                        <input type="file" id="facilityImage" name="facilityImage" accept="image/*" style="display: none;">
                    </div>
                    <div class="file-info" id="fileInfo">
                        <div class="file-name" id="fileName"></div>
                        <div class="file-size" id="fileSize"></div>
                    </div>
                    <img class="image-preview" id="imagePreview" alt="Facility preview">
                </div>
                <div class="form-group">
                    <label>Facilities & Equipment</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item"><input type="checkbox" id="projector" name="facilities" value="projector"><label for="projector">Projector</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="soundSystem" name="facilities" value="sound_system"><label for="soundSystem">Sound System</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="whiteboard" name="facilities" value="whiteboard"><label for="whiteboard">Whiteboard</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="computers" name="facilities" value="computers"><label for="computers">Computers</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="wifi" name="facilities" value="wifi"><label for="wifi">WiFi</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="ac" name="facilities" value="ac"><label for="ac">Air Conditioning</label></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="additionalEquipment">Additional Equipment (Optional)</label>
                    <textarea id="additionalEquipment" name="additionalEquipment" placeholder="List any additional equipment or special features"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status" required>
                                <option value="available" selected>Available</option>
                                <option value="maintenance">Under Maintenance</option>
                                <option value="unavailable">Temporarily Unavailable</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="bookingRestrictions">Booking Restrictions</label>
                            <select id="bookingRestrictions" name="bookingRestrictions">
                                <option value="none" selected>No Restrictions</option>
                                <option value="faculty_only">Faculty Only</option>
                                <option value="admin_only">Admin Only</option>
                                <option value="approved_only">Approval Required</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Administrative Notes (Optional)</label>
                    <textarea id="notes" name="notes" placeholder="Any internal notes about this facility"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="deleteBtn" class="btn btn-danger">Delete Facility</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                    <button type="submit" class="btn btn-success" id="submitBtn">Add Facility</button>
                </div>
            </form>
        </div>
    </div>
<script>
    // --- Utility to get query params ---
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    const editId = getQueryParam('id');
    const editType = getQueryParam('type');
    const editing = !!editId;

    // --- Navigation tab switching ---
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });
    function logout() {
        if(confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('lhms_loggedIn');
            window.location.href = 'index.html';
        }
    }

    // --- Image Upload UI ---
    const imageUploadArea = document.getElementById('imageUploadArea');
    const facilityImageInput = document.getElementById('facilityImage');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const imagePreview = document.getElementById('imagePreview');

    imageUploadArea.addEventListener('click', () => facilityImageInput.click());
    imageUploadArea.addEventListener('dragover', (e) => { e.preventDefault(); imageUploadArea.classList.add('dragover'); });
    imageUploadArea.addEventListener('dragleave', () => imageUploadArea.classList.remove('dragover'));
    imageUploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        imageUploadArea.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length > 0 && files[0].type.startsWith('image/')) handleImageUpload(files[0]);
        else alert('Please select an image file.');
    });
    facilityImageInput.addEventListener('change', (e) => {
        if (e.target.files[0]) handleImageUpload(e.target.files[0]);
    });
    function handleImageUpload(file) {
        if (file.size > 5 * 1024 * 1024) { alert('File size must be less than 5MB.'); return; }
        fileName.textContent = file.name;
        fileSize.textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB`;
        fileInfo.classList.add('show');
        const reader = new FileReader();
        reader.onload = (e) => { imagePreview.src = e.target.result; imagePreview.classList.add('show'); };
        reader.readAsDataURL(file);
    }
    document.querySelector('button[type="reset"]').addEventListener('click', () => {
        fileInfo.classList.remove('show'); imagePreview.classList.remove('show'); imagePreview.src = '';
    });

    // --- Edit Mode Logic ---
    window.addEventListener('DOMContentLoaded', async () => {
        // Auto-select type from URL
        if (editType) {
            document.getElementById('facilityType').value = editType;
            if (editing) document.getElementById('facilityType').disabled = true;
        }
        if (editing && editType && editId) {
            document.getElementById('formTitle').textContent = 'Edit Facility';
            document.getElementById('submitBtn').textContent = 'Update Facility';
            
            // Show delete button in edit mode
            const deleteBtn = document.getElementById('deleteBtn');
            deleteBtn.style.display = 'inline-block';
            deleteBtn.onclick = async function() {
                if (confirm('Are you sure you want to delete this facility? This action cannot be undone.')) {
                    try {
                        const response = await fetch(`http://localhost:3000/api/facilities/${editType}/${editId}`, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            alert('Facility deleted successfully!');
                            window.location.href = 'facilitiesNEW.html';
                        } else {
                            const error = await response.json();
                            alert('Failed to delete: ' + (error.error || 'Unknown error'));
                        }
                    } catch (error) {
                        console.error('Error deleting facility:', error);
                        alert('Error deleting facility. Please try again.');
                    }
                }
            };
            
            try {
                const res = await fetch(`http://localhost:3000/api/facilities/${editType}/${editId}`);
                const data = await res.json();
                document.getElementById('facilityName').value = data.facilityName || '';
                document.getElementById('facilityCode').value = data.facilityCode || '';
                document.getElementById('capacity').value = data.capacity || '';
                document.getElementById('location').value = data.location || '';
                document.getElementById('status').value = data.status || 'available';
                document.getElementById('bookingRestrictions').value = data.bookingRestrictions || 'none';
                document.getElementById('additionalEquipment').value = data.additionalEquipment || '';
                document.getElementById('notes').value = data.notes || '';
                // Facilities checkboxes
                if (Array.isArray(data.facilities)) {
                    data.facilities.forEach(val => {
                        const cb = document.querySelector('input[name="facilities"][value="' + val + '"]');
                        if (cb) cb.checked = true;
                    });
                }
                // Preview image
                if (data.imageUrl) {
                    imagePreview.src = `http://localhost:3000/uploads/${data.imageUrl}`;
                    imagePreview.classList.add('show');
                }
            } catch (err) {
                alert('Failed to load facility info.');
            }
        }
    });

    // --- Add/Update Facility Submit Handler ---
    document.getElementById('addFacilityForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Upload image if provided
        let imageUrl = '';
        const imageFile = facilityImageInput.files[0];
        if (imageFile) {
            const uploadData = new FormData();
            uploadData.append('facilityImage', imageFile);
            const res = await fetch('http://localhost:3000/api/facilities/upload', {
                method: 'POST', body: uploadData
            });
            const result = await res.json();
            if (res.ok) imageUrl = result.filename;
            else { alert('Image upload failed'); return; }
        }

        // Prepare form data
        const formData = {
            facilityType: document.getElementById('facilityType').value,
            facilityName: document.getElementById('facilityName').value,
            facilityCode: document.getElementById('facilityCode').value,
            capacity: Number(document.getElementById('capacity').value),
            location: document.getElementById('location').value,
            facilities: Array.from(document.querySelectorAll('input[name="facilities"]:checked')).map(cb => cb.value),
            additionalEquipment: document.getElementById('additionalEquipment').value,
            status: document.getElementById('status').value,
            bookingRestrictions: document.getElementById('bookingRestrictions').value,
            notes: document.getElementById('notes').value,
        };
        if (imageUrl) formData.imageUrl = imageUrl;

        try {
            if (editing) {
                // UPDATE
                const res2 = await fetch(`http://localhost:3000/api/facilities/${editType}/${editId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result2 = await res2.json();
                if (res2.ok) {
                    alert('Facility updated!');
                    window.location.href = 'adminMAIN.html';
                } else {
                    alert('Error: ' + (result2.error || 'Unknown error'));
                }
            } else {
                // CREATE
                const res2 = await fetch('http://localhost:3000/api/facilities', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result2 = await res2.json();
                if (res2.ok) {
                    alert('Facility added and timetable collection created!');
                    window.location.href = 'adminMAIN.html';
                } else {
                    alert('Error: ' + (result2.error || 'Unknown error'));
                }
            }
        } catch (err) {
            alert('Failed to send data');
            console.error(err);
        }
    });
</script>
</body>
</html>
