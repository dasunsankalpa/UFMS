<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Facilities View</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background:#8B7355;font-size:17px}

        .header{background:#3b444b;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
        .header h1{font-size:24px;color:#fff;font-weight:900;mix-blend-mode:difference}
        .header p{font-size:14px;margin-top:5px;color:#fff;font-weight:700;mix-blend-mode:difference}
        .header-left{display:flex;align-items:center;gap:15px}
        .logo{height:90px;width:90px;object-fit:cover;background:#fff;border-radius:50%;box-shadow:0 2px 16px rgba(0,0,0,0.18);border:2.5px solid #eee}
        .back-btn{background:#CBB9A3;color:#3B444B;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
        .back-btn:hover{background:#b8a68f;color:#3B444B}

        .container{max-width:1200px;margin:20px auto;padding:0 20px}
        .facilities-container{display:grid;grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));gap:20px;margin-top:20px}
        
        .facility-card{background:#3B444B;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);overflow:hidden;transition:transform 0.2s;display:flex;flex-direction:column}
        .facility-card:hover{transform:translateY(-4px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
        
        .facility-img{width:100%;height:180px;object-fit:cover;background:#dcdde1;cursor:zoom-in}
        
        .facility-content{padding:18px 20px;flex:1;display:flex;flex-direction:column}
        .facility-title{font-size:1.25rem;font-weight:bold;color:#fff;margin-bottom:10px}
        
        .facility-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;color:#fff}
        .facility-capacity,.facility-type,.facility-location{display:inline-block;font-size:0.85rem;background:#CBB9A3;color:#3C1A47;padding:4px 10px;border-radius:12px;font-weight:600}
        
        .facility-features{margin:12px 0}
        .feature-list{list-style:none;padding:0;margin:0}
        .feature-list li{font-size:0.9rem;margin-bottom:6px;color:#fff}
        .feature-list li::before{content:"✓ ";color:#3C1A47;margin-right:5px;font-weight:bold}
        
        .facility-description{color:#fff;font-size:0.9rem;margin-bottom:12px;line-height:1.4}
        
        .availability-status{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:#fff}
        .availability-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
        .available{background:#2ecc71}
        .limited{background:#f39c12}
        .unavailable{background:#e74c3c}
        
        .facility-actions{margin-top:auto;padding-top:12px;display:flex;gap:10px;justify-content:flex-end}
        .book-now-btn{background:#3C1A47;color:#fff;border:none;padding:8px 20px;border-radius:4px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background .2s}
        .book-now-btn:hover{background:#2a1233}
        .book-now-btn:disabled{background:#ccc;cursor:not-allowed;opacity:0.6}

        #imageModal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:9999;display:none;justify-content:center;align-items:center}
        #imageModal img{max-width:90vw;max-height:90vh;background:#fff;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,0.6)}
        #closeModal{position:absolute;top:20px;right:30px;font-size:40px;font-weight:bold;cursor:pointer;color:#fff;z-index:10000}
        #imageModal.open{display:flex !important}

        @media (max-width:768px){
            .header{flex-direction:column;text-align:center;gap:10px}
            .logo{height:70px;width:70px}
            .header h1{font-size:18px}
            .header p{font-size:12px}
            .facilities-container{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="uploads/OIP.jpg" alt="University Logo" class="logo">
            <div>
                <h1>UFMS Facilities</h1>
                <p>Explore Our Lecture Halls and Booking Options</p>
            </div>
        </div>
        <a href="index.html" class="back-btn">← Go Home</a>
    </div>

    <div class="container">
        <div class="facilities-container" id="facilities-container">
            <!-- Facility cards will be injected here -->
        </div>
    </div>

    <!-- Modal for image zoom -->
    <div id="imageModal">
        <span id="closeModal">&times;</span>
        <img id="modalImg" alt="Facility large view">
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const userRole = localStorage.getItem('lhms_role');
        const isAdmin = (userRole === 'admin');

        fetch('http://localhost:3000/api/facilities')
            .then(res => res.json())
            .then(facilities => {
                const container = document.getElementById('facilities-container');
                if (!Array.isArray(facilities) || facilities.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#fff;padding:40px;">No facilities found.</p>';
                    return;
                }
                container.innerHTML = '';
                facilities.sort((a, b) => {
                    const aIsMeeting = (a.facilityType || '').toLowerCase().includes('meeting');
                    const bIsMeeting = (b.facilityType || '').toLowerCase().includes('meeting');
                    if (aIsMeeting && !bIsMeeting) return -1;
                    if (!aIsMeeting && bIsMeeting) return 1;
                    return 0;
                });
                facilities.forEach(fac => {
                    let availClass = '';
                    let availText = '';
                    const status = (fac.status || 'available').toLowerCase();
                    switch (status) {
                        case 'available': availClass = 'available'; availText = 'Available for booking'; break;
                        case 'limited': availClass = 'limited'; availText = 'Limited availability'; break;
                        case 'maintenance': availClass = 'unavailable'; availText = 'Under Maintenance'; break;
                        case 'unavailable': availClass = 'unavailable'; availText = 'Temporarily Unavailable'; break;
                        default: availClass = 'available'; availText = fac.status || 'Available';
                    }
                    const features = Array.isArray(fac.facilities)
                        ? fac.facilities.map(f => `<li>${f}</li>`).join('')
                        : '';
                    let imgSrc = 'https://via.placeholder.com/400x200?text=No+Image';
                    if (fac.imageUrl) {
                        if (/^https?:\/\//i.test(fac.imageUrl)) {
                            imgSrc = fac.imageUrl;
                        } else {
                            imgSrc = `http://localhost:3000/uploads/${fac.imageUrl}`;
                        }
                    }
                    const type = fac.facilityType ? `<span class="facility-type">${fac.facilityType.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/room|hall|lab/gi, s => s[0].toUpperCase() + s.slice(1))}</span>` : '';
                    const location = fac.location ? `<span class="facility-location">${fac.location}</span>` : '';
                    
                    container.insertAdjacentHTML('beforeend', `
                        <div class="facility-card" data-id="${fac._id}" data-type="${fac.facilityType}">
                            <img src="${imgSrc}" alt="${fac.facilityName || fac.facilityType}" class="facility-img">
                            <div class="facility-content">
                                <h3 class="facility-title">${fac.facilityName || '-'}</h3>
                                <div class="facility-meta">
                                    ${type}${location}
                                    <span class="facility-capacity">Capacity: ${fac.capacity || '-'}</span>
                                </div>
                                <div class="facility-features">
                                    <ul class="feature-list">${features}</ul>
                                </div>
                                <div class="availability-status">
                                    <span class="availability-dot ${availClass}"></span>
                                    <span style="font-weight:600;font-size:0.9rem;">${availText}</span>
                                </div>
                                <div class="facility-description">${fac.notes || fac.additionalEquipment || ''}</div>
                                <div class="facility-actions">
                                    <button class="book-now-btn" data-facility="${fac.facilityName || ''}" data-status="${status}" ${(status === 'maintenance' || status === 'unavailable') ? 'disabled' : ''}>Book Now</button>
                                </div>
                            </div>
                        </div>
                    `);
                });

                document.querySelectorAll('.facility-img').forEach(img => {
                    img.addEventListener('click', function() {
                        document.getElementById('modalImg').src = this.src;
                        document.getElementById('imageModal').classList.add('open');
                    });
                });

                document.querySelectorAll('.book-now-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const facility = btn.getAttribute('data-facility');
                        const status = btn.getAttribute('data-status');
                        
                        if (status === 'maintenance') {
                            alert('This facility is currently under maintenance. Bookings cannot be made at this time.');
                            return;
                        }
                        if (status === 'unavailable') {
                            alert('This facility is temporarily unavailable. Bookings cannot be made at this time.');
                            return;
                        }
                        
                        if (localStorage.getItem('lhms_loggedIn') === 'yes') {
                            window.location.href = 'timetable.html?facility=' + encodeURIComponent(facility);
                        } else {
                            alert('Please log in to book a facility.');
                            window.location.href = 'index.html?showLogin=1';
                        }
                    });
                });
            })
            .catch(err => {
                document.getElementById('facilities-container').innerHTML = '<p style="text-align:center;color:#fff;padding:40px;">Error loading facilities.</p>';
                console.error(err);
            });

        document.getElementById('closeModal').onclick = function() {
            document.getElementById('imageModal').classList.remove('open');
            document.getElementById('modalImg').src = "";
        };
        document.getElementById('imageModal').onclick = function(e) {
            if (e.target === this) {
                this.classList.remove('open');
                document.getElementById('modalImg').src = "";
            }
        };
    });
    </script>
</body>
</html>
