<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UFMS - Booking History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background:#8B7355;font-size:17px}

    .header{background:#3b444b;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;height:90px;min-height:90px}
    .header h1{font-size:24px;color:#fff;font-weight:900;mix-blend-mode:difference}
    .header p{font-size:14px;margin-top:5px;color:#fff;font-weight:700;mix-blend-mode:difference}
    .header-left{display:flex;align-items:center;gap:15px}
    .logo{height:90px;width:90px;object-fit:cover;background:#fff;border-radius:50%;box-shadow:0 2px 16px rgba(0,0,0,0.18);border:2.5px solid #eee}
    .back-btn{background:#CBB9A3;color:#3B444B;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px}
    .back-btn:hover{background:#b8a68f;color:#3B444B}

    .section{margin:20px;background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .section-header{padding:20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
    .section-title{font-size:18px;font-weight:bold;color:#333}
    
    .search-bar{display:flex;flex-wrap:wrap;gap:10px;padding:20px;background:#f8f9fa;border-bottom:1px solid #ddd}
    .search-bar input,.search-bar select{padding:8px 12px;border-radius:4px;border:1px solid #ccc;font-size:15px}
    .btn{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:14px}
    .btn-primary{background:#3C1A47;color:#fff}
    .btn-primary:hover{background:#2a1233}

    .table-container{overflow-x:auto;padding:20px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px 15px;text-align:left;border-bottom:1px solid #ddd}
    th{background:#CBB9A3;font-weight:bold;color:#3C1A47;font-size:12px;text-transform:uppercase}
    tr:hover{background:#f8f9fa}

    .status{padding:4px 8px;border-radius:12px;font-size:11px;font-weight:bold;text-transform:uppercase}
    .status.approved{background:#d4edda;color:#155724}
    .status.cancelled{background:#f8d7da;color:#721c24}
    .status.completed{background:#d1ecf1;color:#0c5460}
    .status.pending{background:#fff3cd;color:#856404}

    @media (max-width:768px){
      .header{flex-direction:column;text-align:center;gap:10px}
      .logo{height:70px;width:70px}
      .header h1{font-size:18px}
      .header p{font-size:12px}
      .search-bar{flex-direction:column}
      .search-bar input,.search-bar select,.btn{width:100%}
      table{font-size:12px}
      th,td{padding:8px}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div>
        <h1>Booking History</h1>
        <p>View all facility bookings</p>
      </div>
    </div>
    <button class="back-btn" onclick="window.location.href='adminMAIN.html'">← Back to Dashboard</button>
  </div>

  <div class="section">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search name, facility, or email...">
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="Approved">Approved</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select id="facilityFilter">
        <option value="">All Facilities</option>
        <option value="Lecture Hall">Lecture Hall</option>
        <option value="Computer Lab">Computer Lab</option>
        <option value="Seminar Hall">Seminar Hall</option>
      </select>
      <button class="btn btn-primary" onclick="applyFilters()">Search</button>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Facility</th>
            <th>Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>People</th>
            <th>Purpose</th>
            <th>Status</th>
            <th>Action By</th>
            <th>Action At</th>
          </tr>
        </thead>
        <tbody id="bookings">
          <tr><td colspan="10" style="text-align:center;color:#999;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let bookingHistory = [];
    function formatDate(date) {
      if (!date) return '';
      const d = new Date(date);
      return isNaN(d) ? date : d.toLocaleDateString('en-GB');
    }
    function formatDateTime(date) {
      if (!date) return '';
      const d = new Date(date);
      return isNaN(d) ? date : d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }
    function getStatus(status) {
      const s = (status || 'pending').toLowerCase();
      let display = '';
      let cls = '';
      if (s === 'approved') { display = 'APPROVED'; cls = 'approved'; }
      else if (s === 'cancelled') { display = 'CANCELLED'; cls = 'cancelled'; }
      else if (s === 'completed') { display = 'COMPLETED'; cls = 'completed'; }
      else { display = status || 'PENDING'; cls = 'pending'; }
      return `<span class="status ${cls}">${display}</span>`;
    }
    function createRow(booking, index) {
      const id = booking._id ? booking._id.slice(-4).toUpperCase() : index.toString().padStart(4, '0');
      const time = booking.startTime && booking.endTime ? `${booking.startTime}-${booking.endTime}` : (booking.startTime || '');
      return `
        <tr>
          <td>#${id}</td>
          <td>${booking.facility || ''}</td>
          <td>${booking.fullname || ''} (${booking.email || ''})</td>
          <td>${formatDate(booking.bookingDate)}</td>
          <td>${time}</td>
          <td>${booking.participants || ''}</td>
          <td>${booking.purpose || ''}</td>
          <td>${getStatus(booking.status)}</td>
          <td>${booking.actionBy || ''}</td>
          <td>${formatDateTime(booking.actionAt || booking.updatedAt || booking.createdAt)}</td>
        </tr>
      `;
    }
    async function getBookingHistory() {
      try {
        const response = await fetch('http://localhost:3000/api/booking-history');
        return response.ok ? await response.json() : [];
      } catch (error) {
        console.error('Error:', error);
        return [];
      }
    }
    function renderTable(data) {
      const tbody = document.getElementById('bookings');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#999;">No booking history found</td></tr>';
      } else {
        tbody.innerHTML = data.map(createRow).join('');
      }
    }
    function applyFilters() {
      let filtered = bookingHistory.slice();
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const facility = document.getElementById('facilityFilter').value;
      if (search) {
        filtered = filtered.filter(b =>
          (b.fullname && b.fullname.toLowerCase().includes(search)) ||
          (b.facility && b.facility.toLowerCase().includes(search)) ||
          (b.email && b.email.toLowerCase().includes(search)) ||
          (b.purpose && b.purpose.toLowerCase().includes(search))
        );
      }
      if (status) {
        filtered = filtered.filter(b => (b.status || '').toLowerCase() === status.toLowerCase());
      }
      if (facility) {
        filtered = filtered.filter(b => (b.facility || '') === facility);
      }
      renderTable(filtered);
    }
    async function loadData() {
      bookingHistory = await getBookingHistory();
      renderTable(bookingHistory);
    }
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);
    document.getElementById('facilityFilter').addEventListener('change', applyFilters);
    loadData();
  </script>
</body>
</html>
